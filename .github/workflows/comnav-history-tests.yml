name: ComNav history tests

on:
  push:
    branches:
      - feature/comnav-history-events
  pull_request:

jobs:
  history-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest requests
      - name: Check integration syntax
        run: python -m compileall -q custom_components/ultrasync
      - name: Test ComNav history
        run: python -m pytest -q tests/test_comnav_history_xml.py
